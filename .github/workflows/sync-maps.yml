name: Sync map squares

on:
  schedule:
    - cron: "0 3 4 * *"   # the 4th of every month, after the routing sync on the 2nd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-maps
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.p.outputs.build }}
      stamp: ${{ steps.p.outputs.stamp }}
      batches: ${{ steps.p.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          out=$(python3 scripts/sync_maps.py plan 40)
          echo "build=$(echo "$out" | jq -r .build)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(echo "$out" | jq -r .stamp)" >> "$GITHUB_OUTPUT"
          echo "batches=$(echo "$out" | jq -c .batches)" >> "$GITHUB_OUTPUT"

  cut:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cut and upload squares
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_maps.py cut "${{ needs.plan.outputs.build }}" "${{ needs.plan.outputs.stamp }}" "${{ matrix.batch }}" ${{ matrix.names }}
      - uses: actions/upload-artifact@v4
        with:
          name: maps-${{ matrix.batch }}
          path: maps-${{ matrix.batch }}.json

  index:
    needs: [plan, cut]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: batches
      - name: Publish the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_maps.py index "${{ needs.plan.outputs.stamp }}" batches
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routing/index.json
          git diff --cached --quiet || git commit -m "maps: index $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
