name: Sync map squares

# Weekly, a slice of the squares: the ones checked longest ago are cut from
# the newest Protomaps build and uploaded only if they changed. Every square
# comes round about every 12 weeks. Run it by hand with a bigger count to
# fill the mirror the first time (count 0 means the weekly slice).
on:
  schedule:
    - cron: "41 4 * * 3"   # Wednesdays, 04:41 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "Squares to look at (0 = the weekly slice, 1200 = all)"
        default: "0"
      batches:
        description: "Parallel jobs"
        default: "8"

permissions:
  contents: write

concurrency:
  group: sync-maps
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.p.outputs.build }}
      stamp: ${{ steps.p.outputs.stamp }}
      batches: ${{ steps.p.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          out=$(python3 scripts/sync_maps.py plan "${{ inputs.count || '0' }}" "${{ inputs.batches || '8' }}")
          echo "build=$(echo "$out" | jq -r .build)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(echo "$out" | jq -r .stamp)" >> "$GITHUB_OUTPUT"
          echo "batches=$(echo "$out" | jq -c .batches)" >> "$GITHUB_OUTPUT"

  cut:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cut, compare and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_maps.py cut "${{ needs.plan.outputs.build }}" "${{ needs.plan.outputs.stamp }}" "${{ matrix.batch }}" ${{ matrix.names }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maps-${{ matrix.batch }}
          path: maps-${{ matrix.batch }}.json
          if-no-files-found: ignore

  index:
    needs: [plan, cut]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: batches
      - name: Publish the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_maps.py index batches
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routing/index.json
          git diff --cached --quiet || git commit -m "maps: index $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
