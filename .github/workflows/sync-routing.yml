name: Sync routing tiles

on:
  schedule:
    - cron: "0 3 2 * *"   # the 2nd of every month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-routing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Mirror brouter.de tiles into releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_routing.py
      - name: Publish the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routing/index.json
          git diff --cached --quiet || git commit -m "routing: index $(date -u +%Y-%m-%d)"
          git push
